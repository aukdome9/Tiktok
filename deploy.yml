import { useState, useEffect, useRef } from 'react'

const STORAGE_KEY = 'im_pipeline_config_v1'

const SYSTEM_PROMPT = `You are the TikTok copy engine for Aukdom Ethnine (A.E.) — creator of The Invisible Monastery. You generate TikTok content that is spiritually grounded, direct, and built on Aukdom's proprietary worldview.

BRAND VOCABULARY (use 1-2 per post, naturally):
- Reality architect: person actively constructing their experience
- Dimensional walker: moving between states of consciousness deliberately
- Opulence mindset: abundance as the natural state, not something earned
- Divine incarnation: showing up fully human IS the sacred act
- Invisible Monastery: the internal sacred architecture a person carries
- First nature: who you were before conditioning
- Remembering not becoming: growth as recovery, not construction

VOICE RULES:
- Second person ("you") always
- Direct, grounded, spiritually sovereign
- Speak FROM the worldview, not about it
- Short sentences hit harder
- Never: "unlock your potential," "embark on a journey," "be the best version"
- Never generic self-help language

NICHE INTELLIGENCE:
- Hook must land in first 3 seconds
- Saves and shares outperform likes algorithmically
- Content that names something felt-but-unspoken drives saves
- Content that feels "made for someone I know" drives shares
- Speak from conviction, not persuasion
- Platform average engagement: 1.86% — educational spiritual content hits 9.5%
- Under 40 seconds dramatically outperforms longer clips

HOOK TYPES: Bold Claim | Reframe | Call-Out | Result Hook | Authority Statement

HASHTAG RULES:
- 4-6 hashtags max
- Always include 1 brand tag: #invisiblemonastery OR #dimensionalwalker OR #realityarchitect OR #opulencemindset
- Never: #fyp #foryou #foryoupage
- Niche tags to rotate: #abundancemindset #manifestation #divinelyfavored #spiritualgrowth #lawofattraction #consciousnessexpansion #selfmastery #spiritualawakening

OUTPUT: Respond ONLY with a valid JSON object. No preamble, no markdown, no backticks. Exactly this structure:
{
  "title": "6-10 word punchy title that stops the scroll",
  "description": "Full caption: hook sentence | 2-3 sentence core breakdown in Aukdom voice | 1-2 sentence transformation | ends open (no CTA — added separately)",
  "hashtags": "#tag1 #tag2 #tag3 #tag4 #tag5",
  "topic": "2-4 word theme label (e.g. Divine Protection, Abundance Alignment)",
  "hook_type": "one of: Bold Claim | Reframe | Call-Out | Result Hook | Authority Statement",
  "engagement_goal": "one of: Saves | Shares | Comments"
}`

const TOPIC_SUGGESTIONS = [
  'Divine Protection', 'Abundance Alignment', 'Shadow Integration',
  'Opulence Mindset', 'Reality Architecture', 'Dimensional Walking',
  'Emotional Healing', 'Manifestation', 'Self-Mastery', 'Stillness',
]

const TAG_COLORS = {
  'Make.com': '#5BA3D9',
  'Claude':   '#C8922A',
  'Notion':   '#8B8FA8',
}

const CTA_EMOJIS = ['🏛️', '🔥', '🌙', '⚡', '💎', '🌿']

function loadConfig() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY)
    return raw ? JSON.parse(raw) : { webhookUrl: '', apiKey: '' }
  } catch {
    return { webhookUrl: '', apiKey: '' }
  }
}

function saveConfig(config) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(config)) } catch {}
}

export default function App() {
  const [config, setConfig] = useState(loadConfig)
  const [showSetup, setShowSetup] = useState(false)
  const [transcript, setTranscript] = useState('')
  const [source, setSource] = useState('')
  const [topic, setTopic] = useState('')
  const [step, setStep] = useState('input')
  const [result, setResult] = useState(null)
  const [edited, setEdited] = useState({})
  const [errorMsg, setErrorMsg] = useState('')
  const [cta, setCta] = useState(false)
  const [ctaEmoji, setCtaEmoji] = useState('🏛️')
  const configRef = useRef(config)

  useEffect(() => { configRef.current = config }, [config])

  const handleSaveConfig = (updates) => {
    const next = { ...config, ...updates }
    setConfig(next)
    saveConfig(next)
    configRef.current = next
    setShowSetup(false)
  }

  const generate = async () => {
    if (!transcript.trim()) return
    const { apiKey } = configRef.current
    if (!apiKey) { setShowSetup(true); return }
    setStep('generating')
    setErrorMsg('')
    try {
      const res = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-api-key': apiKey,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true',
        },
        body: JSON.stringify({
          model: 'claude-sonnet-4-20250514',
          max_tokens: 1000,
          system: SYSTEM_PROMPT,
          messages: [{ role: 'user', content: `Generate TikTok copy for this transcript:\n\n${transcript}` }],
        }),
      })
      if (!res.ok) {
        const err = await res.json()
        throw new Error(err?.error?.message || `API error ${res.status}`)
      }
      const data = await res.json()
      const raw = data.content?.find(b => b.type === 'text')?.text || ''
      const clean = raw.replace(/```json|```/g, '').trim()
      const parsed = JSON.parse(clean)
      setResult(parsed)
      setEdited({ ...parsed, topic: topic || parsed.topic })
      setStep('review')
    } catch (e) {
      setErrorMsg(e.message || 'Generation failed. Check your API key and try again.')
      setStep('error')
    }
  }

  const sendToNotion = async () => {
    const { webhookUrl } = configRef.current
    if (!webhookUrl) { setShowSetup(true); return }
    setStep('sending')
    const finalDesc = cta
      ? `${edited.description}\n\nComment ${ctaEmoji} to get a personal invitation to the Invisible Monastery community chat.`
      : edited.description
    try {
      await fetch(webhookUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          title: edited.title,
          description: finalDesc,
          hashtags: edited.hashtags,
          topic: edited.topic,
          hook_type: edited.hook_type,
          engagement_goal: edited.engagement_goal,
          source: source || 'unspecified',
          submitted_at: new Date().toISOString(),
        }),
      })
      setStep('done')
    } catch (e) {
      setErrorMsg('Webhook delivery failed. Verify your Make.com URL in setup.')
      setStep('error')
    }
  }

  const reset = () => {
    setTranscript(''); setSource(''); setTopic('')
    setResult(null); setEdited({}); setCta(false); setCtaEmoji('🏛️')
    setStep('input'); setErrorMsg('')
  }

  const s = (field, val) => setEdited(e => ({ ...e, [field]: val }))

  const configured = config.apiKey && config.webhookUrl

  return (
    <div style={styles.root}>
      <style>{css}</style>

      {showSetup && (
        <div style={styles.overlay}>
          <SetupPanel config={config} onSave={handleSaveConfig} onCancel={() => setShowSetup(false)} />
        </div>
      )}

      {/* Header */}
      <header style={styles.header}>
        <div style={styles.headerInner}>
          <div>
            <p style={styles.eyebrow}>The Invisible Monastery</p>
            <h1 style={styles.headerTitle}>TikTok → Notion Pipeline</h1>
          </div>
          <div style={{ display: 'flex', gap: 8, alignItems: 'center', flexWrap: 'wrap' }}>
            {['Make.com', 'Claude', 'Notion'].map(t => (
              <span key={t} style={{ ...styles.tagPill, color: TAG_COLORS[t], borderColor: TAG_COLORS[t] + '33' }}>{t}</span>
            ))}
            <button className="btn-ghost" style={{ marginLeft: 4 }} onClick={() => setShowSetup(true)}>⚙ setup</button>
          </div>
        </div>
      </header>

      <main style={styles.main}>

        {/* Config warning */}
        {!configured && step === 'input' && (
          <div style={styles.warning}>
            <span style={{ color: '#C8922A' }}>⚠</span>
            &nbsp;Setup required before generating —&nbsp;
            <span style={styles.warnLink} onClick={() => setShowSetup(true)}>open setup</span>
            &nbsp;to add your API key and webhook URL.
          </div>
        )}

        {/* INPUT */}
        {(step === 'input' || step === 'error') && (
          <div className="slide-up">
            <div style={styles.fieldWrap}>
              <label style={styles.label}>Transcript or clip notes</label>
              <textarea
                rows={9}
                style={styles.textarea}
                placeholder="Paste the transcript here — raw speech, rough notes, or a full clip breakdown..."
                value={transcript}
                onChange={e => setTranscript(e.target.value)}
              />
            </div>

            <div style={{ display: 'flex', gap: 16 }}>
              <div style={{ ...styles.fieldWrap, flex: 1 }}>
                <label style={styles.label}>Source clip (optional)</label>
                <input style={styles.input} placeholder="e.g. Portrait clip 04..." value={source} onChange={e => setSource(e.target.value)} />
              </div>
              <div style={{ ...styles.fieldWrap, flex: 1 }}>
                <label style={styles.label}>Topic override (optional)</label>
                <input style={styles.input} placeholder="Auto-detected if blank..." value={topic} onChange={e => setTopic(e.target.value)} />
              </div>
            </div>

            <div style={styles.fieldWrap}>
              <label style={styles.label}>Topic suggestions</label>
              <div style={{ marginTop: 6 }}>
                {TOPIC_SUGGESTIONS.map(t => (
                  <span
                    key={t}
                    className={`chip${topic === t ? ' chip-active' : ''}`}
                    onClick={() => setTopic(t === topic ? '' : t)}
                  >{t}</span>
                ))}
              </div>
            </div>

            {step === 'error' && (
              <p style={styles.errorMsg}>✕ {errorMsg}</p>
            )}

            <button
              className="btn-primary"
              disabled={!transcript.trim()}
              onClick={generate}
            >Generate copy →</button>
          </div>
        )}

        {/* GENERATING */}
        {step === 'generating' && (
          <div className="pulsing" style={styles.centered}>
            <p style={styles.loadingTitle}>Generating copy...</p>
            <p style={styles.loadingSubtitle}>Running niche calibration + brand alignment</p>
          </div>
        )}

        {/* REVIEW */}
        {step === 'review' && edited && (
          <div className="slide-up">
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 24 }}>
              <div>
                <p style={styles.eyebrow}>Review + edit</p>
                <h2 style={styles.sectionTitle}>Copy ready</h2>
              </div>
              <div style={{ display: 'flex', gap: 8 }}>
                <span style={styles.badge}>{edited.hook_type}</span>
                <span style={styles.badge}>{edited.engagement_goal}</span>
              </div>
            </div>

            <div style={styles.fieldWrap}>
              <label style={styles.label}>Title</label>
              <input style={styles.input} value={edited.title || ''} onChange={e => s('title', e.target.value)} />
            </div>
            <div style={styles.fieldWrap}>
              <label style={styles.label}>Description</label>
              <textarea rows={6} style={styles.textarea} value={edited.description || ''} onChange={e => s('description', e.target.value)} />
            </div>
            <div style={styles.fieldWrap}>
              <label style={styles.label}>Hashtags</label>
              <input style={styles.input} value={edited.hashtags || ''} onChange={e => s('hashtags', e.target.value)} />
            </div>
            <div style={styles.fieldWrap}>
              <label style={styles.label}>Topic</label>
              <input style={styles.input} value={edited.topic || ''} onChange={e => s('topic', e.target.value)} />
            </div>

            <div style={styles.divider} />

            {/* CTA */}
            <div style={styles.fieldWrap}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 14, marginBottom: 10 }}>
                <label style={styles.label}>Add community CTA?</label>
                <button className={cta ? 'btn-toggle-on' : 'btn-toggle'} onClick={() => setCta(c => !c)}>
                  {cta ? 'yes' : 'no'}
                </button>
              </div>
              {cta && (
                <div className="slide-up">
                  <p style={{ fontSize: 12, color: '#555', marginBottom: 10, fontStyle: 'italic' }}>
                    "Comment [emoji] to get a personal invitation to the Invisible Monastery community chat."
                  </p>
                  <div style={{ display: 'flex', gap: 6 }}>
                    {CTA_EMOJIS.map(e => (
                      <button
                        key={e}
                        className={ctaEmoji === e ? 'emoji-btn emoji-active' : 'emoji-btn'}
                        onClick={() => setCtaEmoji(e)}
                      >{e}</button>
                    ))}
                  </div>
                </div>
              )}
            </div>

            <button className="btn-green" onClick={sendToNotion}>Send to Notion via Make.com →</button>
            <div style={{ textAlign: 'center', marginTop: 12 }}>
              <button className="btn-ghost" onClick={reset}>start over</button>
            </div>
          </div>
        )}

        {/* SENDING */}
        {step === 'sending' && (
          <div className="pulsing" style={styles.centered}>
            <p style={styles.loadingTitle}>Sending to Make.com...</p>
            <p style={styles.loadingSubtitle}>Webhook firing → Notion record incoming</p>
          </div>
        )}

        {/* DONE */}
        {step === 'done' && (
          <div className="slide-up" style={{ textAlign: 'center', padding: '64px 0' }}>
            <p style={{ ...styles.eyebrow, color: '#1A6B4A', marginBottom: 16 }}>✓ Delivered</p>
            <h2 style={{ fontFamily: "'Cormorant Garamond', serif", fontSize: 28, fontWeight: 400, fontStyle: 'italic', color: '#E8E0D4', margin: '0 0 10px' }}>
              "{edited.title}"
            </h2>
            <p style={{ fontSize: 13, color: '#555', margin: '0 0 8px', fontStyle: 'italic' }}>
              {edited.topic} · {edited.engagement_goal} · {edited.hook_type}
            </p>
            <p style={{ fontSize: 12, color: '#3A3A42', marginBottom: 40 }}>
              Make.com received the payload — Notion record is being created with the next open posting slot.
            </p>
            <button className="btn-primary" onClick={reset} style={{ maxWidth: 220, margin: '0 auto', display: 'block' }}>
              New clip →
            </button>
          </div>
        )}
      </main>

      <footer style={styles.footer}>
        <p style={{ fontFamily: "'Cormorant Garamond', serif", fontStyle: 'italic', fontSize: 13, color: '#2A2A30', margin: 0 }}>
          You transmit. The architecture handles everything else.
        </p>
      </footer>
    </div>
  )
}

function SetupPanel({ config, onSave, onCancel }) {
  const [apiKey, setApiKey] = useState(config.apiKey || '')
  const [webhookUrl, setWebhookUrl] = useState(config.webhookUrl || '')

  return (
    <div style={styles.setupBox} className="slide-up">
      <p style={styles.eyebrow}>Configuration</p>
      <h2 style={{ ...styles.sectionTitle, marginBottom: 6 }}>Setup</h2>
      <p style={{ fontSize: 13, color: '#555', marginBottom: 28, fontStyle: 'italic', lineHeight: 1.6 }}>
        Both values are saved to your browser only — never transmitted anywhere except the endpoints you specify.
      </p>

      <div style={styles.fieldWrap}>
        <label style={styles.label}>Anthropic API key</label>
        <input
          style={styles.input}
          type="password"
          placeholder="sk-ant-..."
          value={apiKey}
          onChange={e => setApiKey(e.target.value)}
        />
        <p style={{ fontSize: 11, color: '#3A3A42', marginTop: 6, fontStyle: 'italic' }}>
          Get yours at console.anthropic.com → API Keys
        </p>
      </div>

      <div style={styles.fieldWrap}>
        <label style={styles.label}>Make.com webhook URL</label>
        <input
          style={styles.input}
          placeholder="https://hook.make.com/..."
          value={webhookUrl}
          onChange={e => setWebhookUrl(e.target.value)}
        />
        <p style={{ fontSize: 11, color: '#3A3A42', marginTop: 6, fontStyle: 'italic' }}>
          In Make.com: New scenario → Custom Webhook module → copy the URL here
        </p>
      </div>

      <div style={{ display: 'flex', gap: 10, marginTop: 8 }}>
        <button
          className="btn-primary"
          style={{ flex: 1 }}
          disabled={!apiKey.trim() || !webhookUrl.trim()}
          onClick={() => onSave({ apiKey: apiKey.trim(), webhookUrl: webhookUrl.trim() })}
        >Save configuration</button>
        <button className="btn-ghost" onClick={onCancel}>cancel</button>
      </div>
    </div>
  )
}

